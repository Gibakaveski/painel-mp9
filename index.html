const d=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0));
async function abrir(pw){
  const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:d(S),iterations:IT,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:d(I)},key,d(C));
  const html=new TextDecoder().decode(pt);
  document.open();document.write(html);document.close();
}

document.getElementById('f').addEventListener('submit',async e=>{

});
